name: Bump Version and Tag

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    # Prevent the action from triggering itself in an infinite loop
    if: "!contains(github.event.head_commit.message, 'Release MicroZig')"
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push commits and tags

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve current version
        id: current
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next patch version
        id: next
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
          NEW_PATCH=$(( PATCH + 1 ))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in files
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          OLD_ESC="${OLD//./\\.}"
          sed -i "s/\.version = \"${OLD_ESC}\"/.version = \"${NEW}\"/" build.zig.zon
          sed -i "s/${OLD_ESC}/${NEW}/g" website/content/docs/getting-started.smd
          echo "Bumped $OLD -> $NEW"

      - name: Commit version bump
        run: |
          git add -A
          # Only commit if there are actual changes (avoids empty-commit errors)
          if ! git diff --cached --quiet; then
            git commit -m "Release MicroZig ${{ steps.next.outputs.version }}"
          else
            echo "No file changes to commit (files may already be up to date)"
          fi

      - name: Create and push version tag
        run: |
          git tag "${{ steps.next.outputs.version }}"
          git push origin HEAD:main --follow-tags
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
